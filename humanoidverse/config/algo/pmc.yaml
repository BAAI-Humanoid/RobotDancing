# @package _global_

algo:
  _target_: humanoidverse.agents.pmc.pmc.PMC
  _recursive_: False
  config:
    # Basic training configuration
    num_steps_per_env: 24
    num_learning_iterations: 50000
    num_learning_epochs: 5
    num_mini_batches: 4
    save_interval: 1000

    # PPO hyperparameters
    clip_param: 0.2
    gamma: 0.99
    lam: 0.95
    value_loss_coef: 1.0
    entropy_coef: 0.01
    max_grad_norm: 1.0
    use_clipped_value_loss: true

    # Learning rates
    actor_learning_rate: 3.0e-4
    critic_learning_rate: 1.0e-3
    schedule: "adaptive"
    desired_kl: 0.01

    # PMC specific parameters
    vq_loss_coef: 0.1  # Coefficient for VQ-VAE loss

    # Initialization
    init_noise_std: 1.0
    init_at_random_ep_len: true
    load_optimizer: true

    grad_penalty_coef_schedule: [0.002, 0.002, 700, 1000]

    eval_callbacks: null

    module_dict:
      actor: 
        use_vq: true
        latent_dim: 64
        num_embeddings: 512
        encoder_config:
          type: 'MLP'
          hidden_dims: [256, 128, 64]
          activation: 'ReLU'

        input_dim: ['actor_obs']
        output_dim: ['robot_action_dim']
        layer_config:
          type: MLP
          hidden_dims: [1024, 1024, 512]
          activation: ELU
      critic: 
        type: MLP
        input_dim: ['critic_obs']
        output_dim: [1]
        layer_config:
          type: MLP
          hidden_dims: [1024, 1024, 512]
          activation: ELU