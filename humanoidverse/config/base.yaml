# First we define the global structures that will be used by all the configs.
defaults:
  # - base/fabric
  - _self_
  - base/hydra
  - base/structure
  - simulator/isaacgym
  - exp/motion_tracking
  - robot/g1/g1_23dof_lock_wrist
  - optional resampling: uniform
  - rewards/motion_tracking: reward_motion_tracking_rd
  - terrain/terrain_locomotion_plane
  - obs/motion_tracking: rd
  - domain_rand/domain_rand_base
  - opt/wandb

# These are global variables that all levels of the config can access.
## Experiment setup
seed: 0
codebase_version: 1.0  # this is recorded to enable auto-conversion of models between different versions of the codebase
headless: True
num_envs: 4096

### Checkpoint logic
auto_load_latest: False
checkpoint: null

### Naming and dir structure
project_name: RobotDancing
experiment_name: TEST

base_dir: logs
timestamp: ${now:%Y%m%d_%H%M%S}
experiment_dir: ${base_dir}/${project_name}/${timestamp}-${experiment_name}-${log_task_name}-${robot.asset.robot_type}
save_dir: ${experiment_dir}/.hydra

force_flat_terrain: False

use_wandb: True
# wandb:
#   wandb_dir: ${experiment_dir}/wandb
#   wandb_entity: null

log_task_name: TEST

### Simulation
sim_type: isaacgym
env_spacing: 20
output_dir: ${experiment_dir}/output

eval_overrides:
  headless: False
  num_envs: 1
  auto_load_latest: False
  use_wandb: False
